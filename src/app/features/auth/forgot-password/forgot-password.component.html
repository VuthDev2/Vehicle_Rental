<app-auth-layout
  eyebrow="Support"
  headline="No worries,"
  headlineAccent="we've got you."
  description="Enter the email address associated with your account and we'll send you a 6-digit code to reset your password."
>
  <div class="auth-header">
    <h1 class="auth-title">Forgot password?</h1>
    <p class="auth-subtitle">Enter your email and we'll send a secure 6-digit code to restore access.</p>
  </div>

  @if (error()) {
    <div class="auth-alert auth-alert--error">
      <span class="material-symbols-outlined">error</span>
      <span>{{ error() }}</span>
    </div>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()" class="auth-form">
      <div class="auth-field">
        <label class="auth-label" for="forgot-email">Email address</label>
        <div class="auth-input-wrap">
          <span class="material-symbols-outlined auth-input-icon">mail</span>
          <input
            id="forgot-email"
            type="email"
            formControlName="email"
            placeholder="you@company.com"
            class="auth-input auth-input--icon"
            [class.is-invalid]="isFieldInvalid('email')"
          />
        </div>
        @if (isFieldInvalid('email')) {
          <p class="auth-field-error">
            <span class="material-symbols-outlined">error</span>
            Valid email is required.
          </p>
        }
      </div>

      <button type="submit" class="auth-btn" [disabled]="loading() || form.invalid">
        @if (loading()) {
          <span class="material-symbols-outlined spin">progress_activity</span>
          Sending code...
        } @else {
          Send reset code
        }
      </button>
    </form>

  <p class="auth-footer-text">
    <a routerLink="/login" class="auth-link auth-link--back">
      <span class="material-symbols-outlined">arrow_back</span>
      Back to sign in
    </a>
  </p>
</app-auth-layout>
