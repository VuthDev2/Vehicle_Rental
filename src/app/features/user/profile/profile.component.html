<div class="min-h-full pb-24 font-sans max-w-lg lg:max-w-5xl mx-auto lg:px-8 transition-all">
  <!-- Profile Header -->
  <div class="profile-header lg:mt-8 lg:mb-10 lg:p-8 lg:rounded-[24px]">
    <div class="profile-avatar lg:w-20 lg:h-20 lg:text-3xl">
      @if (avatarUrl) {
        <img [src]="avatarUrl" [alt]="(auth.user()?.name || 'Profile') + ' photo'" class="h-full w-full object-cover rounded-full" />
      } @else {
        {{ initials }}
      }
    </div>
    <div class="flex-1 min-w-0">
      <h1 class="text-xl font-bold text-[#111827] truncate">{{ auth.user()?.name || 'My Profile' }}</h1>
      <p class="text-[0.8rem] text-[#4b5563] mt-1">{{ auth.user()?.phone || '+855 12 345 678' }}</p>
      <p class="text-[0.8rem] text-[#6b7280] truncate mt-0.5">{{ auth.user()?.email || 'No email address' }}</p>
    </div>
    <div class="chevron">
      <span class="material-symbols-outlined">chevron_right</span>
    </div>
  </div>

  <!-- Two Column Grid -->
  <div class="lg:grid lg:grid-cols-2 lg:gap-12 lg:items-start">
    <!-- Left Column -->
    <div>
      <h2 class="section-title lg:text-xl">Account</h2>
      <div class="menu-list">
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">person_outline</span></div>
          <div class="menu-content">
            <h3 class="menu-title">Personal Information</h3>
            <p class="menu-desc">Update your personal details</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">badge</span></div>
          <div class="menu-content">
            <h3 class="menu-title">Driver License</h3>
            <p class="menu-desc">View and manage your license</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">location_on</span></div>
          <div class="menu-content">
            <h3 class="menu-title">Addresses</h3>
            <p class="menu-desc">Manage saved addresses</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">notifications_active</span></div>
          <div class="menu-content">
            <h3 class="menu-title">Notification Settings</h3>
            <p class="menu-desc">Manage your notifications</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">lock_outline</span></div>
          <div class="menu-content">
            <h3 class="menu-title">Security</h3>
            <p class="menu-desc">Change password, biometric, etc.</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
      </div>
    </div> <!-- End Left Column -->

    <!-- Right Column -->
    <div>
      <h2 class="section-title lg:text-xl">More</h2>
      <div class="menu-list">
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">account_balance_wallet</span></div>
          <div class="menu-content">
            <h3 class="menu-title">My Wallet</h3>
            <p class="menu-desc">View balance and transactions</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">redeem</span></div>
          <div class="menu-content">
            <h3 class="menu-title">Refer & Earn</h3>
            <p class="menu-desc">Invite friends and earn rewards</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">headset_mic</span></div>
          <div class="menu-content">
            <h3 class="menu-title">Help & Support</h3>
            <p class="menu-desc">FAQs and contact support</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">description</span></div>
          <div class="menu-content">
            <h3 class="menu-title">Terms & Conditions</h3>
            <p class="menu-desc">Read our terms and policies</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
        <button class="menu-item">
          <div class="menu-icon"><span class="material-symbols-outlined">info</span></div>
          <div class="menu-content">
            <h3 class="menu-title">About Cambo Rent</h3>
            <p class="menu-desc">Version 1.0.0</p>
          </div>
          <div class="chevron"><span class="material-symbols-outlined text-xl">chevron_right</span></div>
        </button>
      </div>
    </div> <!-- End Right Column -->
  </div> <!-- End Grid -->

  <!-- Logout Button -->
  <div class="lg:mt-8 lg:flex lg:justify-center">
    <button type="button" (click)="logout()" class="logout-btn lg:w-auto lg:px-12 lg:py-3 lg:text-base">
      <span class="material-symbols-outlined">logout</span>
      Logout
    </button>
  </div>
</div>
