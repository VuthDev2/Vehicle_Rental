# ============================================================
# PRODUCTION Nginx Configuration — with HTTPS (Let's Encrypt)
# ============================================================
# Prerequisites before using this file:
#   1. Point your domain's DNS A record to your server's IP.
#   2. Run Certbot to obtain a certificate:
#      certbot certonly --standalone -d yourdomain.com -d www.yourdomain.com
#   3. Replace ALL instances of "yourdomain.com" below.
#   4. Copy this file to your server and rename it to nginx.conf
#      (overwriting the development one).
# ============================================================

worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # ── Rate limiting at the proxy level ──────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;

    # ── Backend cluster ────────────────────────────────────────────────────────
    upstream backend_cluster {
        ip_hash; # Sticky sessions — required for Socket.io
        server backend1:5001;
        server backend2:5001;
        server backend3:5001;
    }

    # ── HTTP → HTTPS redirect ──────────────────────────────────────────────────
    server {
        listen 80;
        server_name yourdomain.com www.yourdomain.com;
        return 301 https://$host$request_uri;
    }

    # ── HTTPS server ───────────────────────────────────────────────────────────
    server {
        listen 443 ssl;
        server_name yourdomain.com www.yourdomain.com;

        # SSL certificates (issued by Let's Encrypt via Certbot)
        ssl_certificate     /etc/letsencrypt/live/yourdomain.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/yourdomain.com/privkey.pem;

        # Modern SSL settings (TLS 1.2+ only)
        ssl_protocols             TLSv1.2 TLSv1.3;
        ssl_ciphers               HIGH:!aNULL:!MD5;
        ssl_prefer_server_ciphers on;
        ssl_session_cache         shared:SSL:10m;
        ssl_session_timeout       10m;

        # Security headers
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;

        # Gzip compression
        gzip on;
        gzip_types text/plain application/json application/javascript text/css;

        # ── API & WebSocket proxy ──────────────────────────────────────────────
        location / {
            limit_req zone=api burst=50 nodelay;

            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # WebSocket support (required for Socket.io)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            proxy_read_timeout 86400s;
        }

        # ── Let's Encrypt renewal challenge ───────────────────────────────────
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }
    }
}
