worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # Define our backend cluster
    upstream backend_cluster {
        # IMPORTANT: ip_hash is required for Socket.io sticky sessions
        ip_hash;
        
        # We define explicit server names matching our docker-compose services
        server backend1:5001;
        server backend2:5001;
        server backend3:5001;
    }

    server {
        listen 80;

        # Route all traffic to the upstream cluster
        location / {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            # Configuration for WebSocket support (Socket.io)
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }
    }
}
