services:
  # The central Redis instance for rate-limiting and Socket.io pub/sub
  redis:
    image: redis:alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Load Balancer
  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend1
      - backend2
      - backend3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Backend Instances
  backend1:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URI=redis://redis:6379
      - PORT=5001
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    logging:
      # ─── Papertrail centralized logging ────────────────────────────────────
      # TODO: Replace <YOUR_PAPERTRAIL_HOST> and <YOUR_PAPERTRAIL_PORT> with
      #       your values from https://papertrailapp.com → Settings → Log Destinations
      # Once configured, all backend logs will appear in your Papertrail dashboard.
      # ────────────────────────────────────────────────────────────────────────
      driver: "syslog"
      options:
        syslog-address: "udp://<YOUR_PAPERTRAIL_HOST>:<YOUR_PAPERTRAIL_PORT>"
        syslog-format: "rfc5424"
        tag: "cambo-rent/backend1"

  backend2:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URI=redis://redis:6379
      - PORT=5001
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "syslog"
      options:
        syslog-address: "udp://<YOUR_PAPERTRAIL_HOST>:<YOUR_PAPERTRAIL_PORT>"
        syslog-format: "rfc5424"
        tag: "cambo-rent/backend2"

  backend3:
    build: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - REDIS_URI=redis://redis:6379
      - PORT=5001
      - NODE_ENV=production
    depends_on:
      redis:
        condition: service_healthy
    logging:
      driver: "syslog"
      options:
        syslog-address: "udp://<YOUR_PAPERTRAIL_HOST>:<YOUR_PAPERTRAIL_PORT>"
        syslog-format: "rfc5424"
        tag: "cambo-rent/backend3"
